[package]
name = "wakaru"
version = "1.2.0"
description = "Local-first AI notebook for your own documents"
authors = ["Yuki Orita"]
license = "MIT"
edition = "2021"
rust-version = "1.88"

[lib]
name = "wakaru_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "10", features = ["serde-json-impl", "no-serde-warnings"] }

# storage
rusqlite = { version = "0.32", features = ["bundled", "backup", "functions"] }

# ids + time
uuid = { version = "1", features = ["v7"] }
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }

# ingest (Phase 1 — static formats)
sha2 = "0.10"
walkdir = "2"
infer = "0.16"                              # magic-byte kind detection
encoding_rs = "0.8"
chardetng = "0.1"                           # charset sniffing
csv = "1"
tiktoken-rs = "0.6"                         # cl100k_base token estimate (docs/04 §10)
pdf-extract = "0.12"                        # PDF text extraction; PDF.js handles visual rendering
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp", "tiff", "webp"] }
kamadak-exif = "0.5"                        # EXIF orientation
calamine = "0.36"                           # xlsx / xls
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.41"                          # OOXML (pptx / docx)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking", "gzip", "brotli", "json", "stream"] }
url = "2"
http = "1"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
scraper = "0.27"                            # HTML -> readable text (web links)

# AI layer (Phase 3)
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
eventsource-stream = "0.2"                  # SSE parsing for chat/completions
futures-util = "0.3"
sqlite-vec = "0.1"                          # vec0 virtual table for chunk_vectors
fastembed = { version = "6.0.2", default-features = false, features = ["ort-download-binaries-rustls-tls", "hf-hub-rustls-tls"] }

# File Modifier (Phase 8) + document builder (Phase 12)
printpdf = { version = "0.12.7", default-features = false } # images -> PDF, sandwich PDF, build_document pdf
base64 = "0.22"                             # small image previews
docx-rs = "0.4"                             # build_document docx output

# OCR (Phase 12) — pure-Rust, no ONNX/C deps; models downloaded on first use
ocrs = { version = "0.13", default-features = false, features = ["rten"] }
rten = "0.26"

# async + jobs
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "process", "fs"] }
tokio-util = { version = "0.7", features = ["rt"] }

# errors + logging
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
rmcp = { version = "=3.0.1", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest-tls-no-provider"] }
whisper-rs = { version = "0.14", default-features = false, features = ["metal"] }
symphonia = { version = "0.5.5", features = ["mp3", "aac", "isomp4", "wav", "flac", "ogg"] }
silero-vad-crs = "0.4.0"
fontdb = { version = "0.24.0", default-features = false, features = ["fs", "memmap", "std"] }
ttf-parser = { version = "0.25.1", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[target."cfg(unix)".dependencies]
nix = { version = "0.31", features = ["signal", "process", "fs"] }
