# cargo-deny config (docs/08 P11, docs/09 §5). WAKARU ships no GPL/AGPL/LGPL
# code; only permissive / weak-copyleft-file-scope licences are allowed.

[graph]
targets = [
  { triple = "aarch64-apple-darwin" },
  { triple = "x86_64-apple-darwin" },
]
all-features = true

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",          # weak copyleft, file scope — acceptable, no static-link virality
  "CC0-1.0",
  "Unlicense",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "allow"
# Hard bans: full-strength copyleft has no place in a distributed desktop app.
deny = []

[advisories]
version = 2
yanked = "warn"
# These are maintenance-status advisories with no safe upgrade path. They remain
# visible as `note` output; actual vulnerability advisories are never ignored.
ignore = [
  { id = "RUSTSEC-2026-0192", reason = "pdf-extract 0.12 uses ttf-parser 0.25; no maintained replacement is available" },
  { id = "RUSTSEC-2024-0436", reason = "paste 1.0.15 is unmaintained but is only a compile-time identifier-pasting macro, pulled in transitively by fastembed -> tokenizers; it contributes no runtime code, has no maintained drop-in, and no fastembed/tokenizers release yet drops it" },
  { id = "RUSTSEC-2025-0081", reason = "Tauri 2.11 transitively uses the unmaintained unic family; no upstream replacement is available" },
  { id = "RUSTSEC-2025-0075", reason = "Tauri 2.11 transitively uses the unmaintained unic family; no upstream replacement is available" },
  { id = "RUSTSEC-2025-0080", reason = "Tauri 2.11 transitively uses the unmaintained unic family; no upstream replacement is available" },
  { id = "RUSTSEC-2025-0100", reason = "Tauri 2.11 transitively uses the unmaintained unic family; no upstream replacement is available" },
  { id = "RUSTSEC-2025-0098", reason = "Tauri 2.11 transitively uses the unmaintained unic family; no upstream replacement is available" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
