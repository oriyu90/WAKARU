# cargo-deny config (docs/08 P11, docs/09 §5). WAKARU ships no GPL/AGPL/LGPL
# code; only permissive / weak-copyleft-file-scope licences are allowed.

[graph]
targets = [
  { triple = "aarch64-apple-darwin" },
  { triple = "x86_64-apple-darwin" },
]
all-features = true

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",          # weak copyleft, file scope — acceptable, no static-link virality
  "CC0-1.0",
  "Unlicense",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "allow"
# Hard bans: full-strength copyleft has no place in a distributed desktop app.
deny = []

[advisories]
version = 2
yanked = "warn"
# RUSTSEC advisories: surface them, don't fail the licence gate on them.
ignore = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
